<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Qualification Rules Flowchart</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f5f5f5;
            padding: 20px;
            margin: 0;
        }
        .container {
            max-width: 1400px;
            margin: 0 auto;
            background: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        h1 {
            color: #1a237e;
            text-align: center;
            margin-bottom: 30px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Product Qualification Decision Tree</h1>
        
        <svg width="1350" height="1100" viewBox="0 0 1350 1100">
            <defs>
                <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
                    <polygon points="0 0, 10 3, 0 6" fill="#333" />
                </marker>
            </defs>
            
            <rect width="1350" height="900" fill="#fafafa"/>
            
            <!-- Start -->
            <ellipse cx="675" cy="50" rx="100" ry="30" fill="#42a5f5" stroke="#1976d2" stroke-width="2"/>
            <text x="675" y="58" font-size="14" font-weight="bold" text-anchor="middle" fill="white">START: Product</text>
            
            <!-- Decision 1: Discontinued? -->
            <path d="M 675 80 L 675 120" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
            <rect x="550" y="120" width="250" height="60" fill="#fff59d" stroke="#fbc02d" stroke-width="2" rx="5"/>
            <text x="675" y="145" font-size="13" font-weight="bold" text-anchor="middle">Is product discontinued</text>
            <text x="675" y="163" font-size="13" font-weight="bold" text-anchor="middle">or marked for clearance > 90d?</text>
            
            <!-- YES path -->
            <path d="M 550 150 L 400 150" stroke="#d32f2f" stroke-width="2" marker-end="url(#arrow)"/>
            <text x="475" y="145" font-size="11" font-weight="bold" fill="#d32f2f">YES</text>
            <rect x="200" y="120" width="200" height="60" fill="#ffcdd2" stroke="#d32f2f" stroke-width="2" rx="5"/>
            <text x="300" y="145" font-size="13" font-weight="bold" text-anchor="middle" fill="#b71c1c">EXCLUDE</text>
            <text x="300" y="163" font-size="11" text-anchor="middle" fill="#b71c1c">Dead Stock</text>
            
            <!-- NO path -->
            <path d="M 675 180 L 675 220" stroke="#388e3c" stroke-width="2" marker-end="url(#arrow)"/>
            <text x="690" y="205" font-size="11" font-weight="bold" fill="#388e3c">NO</text>
            
            <!-- Decision 2: Channel -->
            <rect x="550" y="220" width="250" height="60" fill="#fff59d" stroke="#fbc02d" stroke-width="2" rx="5"/>
            <text x="675" y="245" font-size="13" font-weight="bold" text-anchor="middle">Which channel?</text>
            <text x="675" y="263" font-size="11" text-anchor="middle">(Physical Store / Ecom)</text>
            
            <!-- Physical Store branch -->
            <path d="M 550 250 L 350 250 L 350 320" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
            <text x="450" y="245" font-size="11" font-weight="bold">Physical</text>
            <rect x="220" y="320" width="260" height="180" fill="#e3f2fd" stroke="#1976d2" stroke-width="2" rx="5"/>
            <text x="350" y="345" font-size="13" font-weight="bold" text-anchor="middle" fill="#1565c0">Physical Store Rules</text>
            <text x="240" y="370" font-size="10">✓ Inventory > 0?</text>
            <text x="240" y="390" font-size="10">✓ Replenishable = TRUE?</text>
            <text x="240" y="410" font-size="10">✓ Sales in last 90d > 0 OR</text>
            <text x="250" y="425" font-size="10">Restocked in last 60d?</text>
            <text x="240" y="450" font-size="10" font-weight="bold">Category Adjustments:</text>
            <text x="240" y="467" font-size="9">• Footwear: 60d window</text>
            <text x="240" y="482" font-size="9">• Sportswear: 90d + seasonal</text>
            <text x="240" y="497" font-size="9">• Made-to-measure: 180d</text>
            
            <!-- Ecom branch -->
            <path d="M 800 250 L 1000 250 L 1000 320" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
            <text x="900" y="245" font-size="11" font-weight="bold">Ecom</text>
            <rect x="870" y="320" width="260" height="180" fill="#e3f2fd" stroke="#1976d2" stroke-width="2" rx="5"/>
            <text x="1000" y="345" font-size="13" font-weight="bold" text-anchor="middle" fill="#1565c0">Ecom Rules</text>
            <text x="890" y="370" font-size="10">✓ Currently listed online?</text>
            <text x="890" y="390" font-size="10">✓ Sales in last 120d > 0 OR</text>
            <text x="900" y="405" font-size="10">New product (< 30d)?</text>
            <text x="890" y="430" font-size="10">If New Product:</text>
            <text x="900" y="447" font-size="9">• Launch < 30d</text>
            <text x="900" y="462" font-size="9">• Inventory > 5 units</text>
            <text x="900" y="477" font-size="9">• Grace period: 30d</text>
            <text x="890" y="495" font-size="10" font-weight="bold" fill="#d32f2f">Note: Only 15k/150k online</text>
            
            <!-- Decision 3: Category Volume -->
            <path d="M 350 500 L 350 540" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
            <path d="M 1000 500 L 1000 540" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
            
            <rect x="225" y="540" width="250" height="60" fill="#fff59d" stroke="#fbc02d" stroke-width="2" rx="5"/>
            <text x="350" y="565" font-size="12" font-weight="bold" text-anchor="middle">Category volume?</text>
            <text x="350" y="583" font-size="10" text-anchor="middle">(High / Low)</text>
            
            <rect x="875" y="540" width="250" height="60" fill="#fff59d" stroke="#fbc02d" stroke-width="2" rx="5"/>
            <text x="1000" y="565" font-size="12" font-weight="bold" text-anchor="middle">Product lifecycle?</text>
            <text x="1000" y="583" font-size="10" text-anchor="middle">(New / Mature)</text>
            
            <!-- High Volume -->
            <path d="M 225 570 L 150 570 L 150 650" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
            <text x="180" y="565" font-size="10" font-weight="bold">High</text>
            <rect x="40" y="650" width="220" height="130" fill="#c8e6c9" stroke="#388e3c" stroke-width="2" rx="5"/>
            <text x="150" y="672" font-size="11" font-weight="bold" text-anchor="middle" fill="#2e7d32">INCLUDE</text>
            <text x="150" y="688" font-size="8.5" text-anchor="middle">High-Volume (Footwear, Groceries)</text>
            <text x="50" y="702" font-size="7">• Lookback: 30-60d | Replenish: 30-60d</text>
            <text x="50" y="713" font-size="7">• Include: 10+ sales/week (30d)</text>
            <text x="50" y="724" font-size="7">• Include: Restocked 2+ in 60d</text>
            <text x="50" y="735" font-size="7">• Include: Top 20% sales/revenue</text>
            <text x="50" y="746" font-size="7">• Exclude: No sales 30d OR no restock 60d</text>
            <text x="50" y="757" font-size="7">• Exclude: Negative margins, high returns</text>
            <text x="50" y="768" font-size="7">• Consider: Seasonal spikes, promotions</text>
            
            <!-- Low Volume -->
            <path d="M 475 570 L 550 570 L 550 650" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
            <text x="515" y="565" font-size="10" font-weight="bold">Low</text>
            <rect x="440" y="650" width="220" height="130" fill="#c8e6c9" stroke="#388e3c" stroke-width="2" rx="5"/>
            <text x="550" y="672" font-size="11" font-weight="bold" text-anchor="middle" fill="#2e7d32">INCLUDE</text>
            <text x="550" y="688" font-size="8.5" text-anchor="middle">Low-Volume (Luxury, Made-to-Measure)</text>
            <text x="450" y="702" font-size="7">• Lookback: 90-180d | Replenish: 60d</text>
            <text x="450" y="713" font-size="7">• Include: 1+ sale/week avg (90d)</text>
            <text x="450" y="724" font-size="7">• Include: Restocked in 60d</text>
            <text x="450" y="735" font-size="7">• Include: Brand identity, strategic upsell</text>
            <text x="450" y="746" font-size="7">• Exclude: No restock 60d OR declining</text>
            <text x="450" y="757" font-size="7">• Exclude: Disrupts supply chain, low margin</text>
            <text x="450" y="768" font-size="7">• Monitor: Custom orders, pre-order items</text>
            
            <!-- New Product -->
            <path d="M 875 570 L 800 570 L 800 650" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
            <text x="835" y="565" font-size="10" font-weight="bold">New</text>
            <rect x="690" y="650" width="220" height="130" fill="#c8e6c9" stroke="#388e3c" stroke-width="2" rx="5"/>
            <text x="800" y="672" font-size="11" font-weight="bold" text-anchor="middle" fill="#2e7d32">INCLUDE</text>
            <text x="800" y="688" font-size="8.5" text-anchor="middle">New Product (< 60d)</text>
            <text x="700" y="702" font-size="7">• Lookback: 30-45d | Grace: 30d</text>
            <text x="700" y="713" font-size="7">• Include: 3+ sales OR 10+ web sessions</text>
            <text x="700" y="724" font-size="7">• Include: Restocked 1+ since launch</text>
            <text x="700" y="735" font-size="7">• Exclude: Fails launch objectives/no restock</text>
            <text x="700" y="746" font-size="7">• Flag: Marketing/limited edition/collab</text>
            <text x="700" y="757" font-size="7">• Monitor: Demand spikes, promotional events</text>
            <text x="700" y="768" font-size="7">• Adjust frequently (high volatility)</text>
            
            <!-- Mature Product -->
            <path d="M 1125 570 L 1200 570 L 1200 650" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
            <text x="1165" y="565" font-size="10" font-weight="bold">Mature</text>
            <rect x="1090" y="650" width="220" height="130" fill="#c8e6c9" stroke="#388e3c" stroke-width="2" rx="5"/>
            <text x="1200" y="672" font-size="11" font-weight="bold" text-anchor="middle" fill="#2e7d32">INCLUDE</text>
            <text x="1200" y="688" font-size="8.5" text-anchor="middle">Mature Product (> 60d)</text>
            <text x="1100" y="702" font-size="7">• Lookback: 90-180d comprehensive</text>
            <text x="1100" y="713" font-size="7">• Include: 1+ sale/week avg (90d)</text>
            <text x="1100" y="724" font-size="7">• Include: Restocked in last 60d</text>
            <text x="1100" y="735" font-size="7">• Exclude: No restock 60d OR declining</text>
            <text x="1100" y="746" font-size="7">• Monitor: Seasonal shifts, category perf</text>
            <text x="1100" y="757" font-size="7">• Monitor: Competitors with similar products</text>
            <text x="1100" y="768" font-size="7">• Watch: Complacency (sudden demand shifts)</text>
            
            <!-- Summary Box -->
            <rect x="50" y="800" width="1250" height="250" fill="#f3e5f5" stroke="#8e24aa" stroke-width="2" rx="8"/>
            <text x="675" y="825" font-size="16" font-weight="bold" text-anchor="middle" fill="#6a1b9a">Qualification Summary & Key Logic</text>
            
            <text x="70" y="855" font-size="11" fill="#333"><tspan font-weight="bold">Input:</tspan> 150k SKUs × 61 stores = 9.15M product-store combinations</text>
            <text x="70" y="875" font-size="11" fill="#333"><tspan font-weight="bold">Output:</tspan> ~3-4M qualified products (70% reduction)</text>
            <text x="70" y="895" font-size="11" fill="#2e7d32"><tspan font-weight="bold">Impact:</tspan> ↓WMAPE 15-25% | ↓Memory 65% | ↑Training 30-40% faster | 0 OOM crashes</text>
            
            <text x="70" y="925" font-size="11" font-weight="bold" fill="#6a1b9a">Key Differentiators:</text>
            <text x="80" y="945" font-size="9">• Physical: 90d sales/60d restock (space limits) | Ecom: 120d sales/90d restock (warehouse flex)</text>
            <text x="80" y="960" font-size="9">• High-vol: 30-60d windows, frequent restock, top 20% revenue | Low-vol: 90-180d windows, brand/strategic items</text>
            <text x="80" y="975" font-size="9">• New: Grace 30d, 3+ sales OR 10+ web sessions, inventory > 5 | Mature: 1+ sale/week, monitor competitors</text>
            <text x="80" y="990" font-size="9">• Dead: 180d no sales | 120d no restock | Discontinued | Clearance > 90d with no sales</text>
            
            <text x="70" y="1015" font-size="11" font-weight="bold" fill="#6a1b9a">Validation & Scale:</text>
            <text x="80" y="1035" font-size="9">• Weekly audits (100 samples), monthly dashboards, quarterly SME reviews, A/B testing, alert triggers</text>
            <text x="80" y="1050" font-size="9">• Chunked processing (500k rows), Polars lazy eval, parallel execution, incremental writes, ~15 min runtime</text>
            
        </svg>
    </div>
</body>
</html>
