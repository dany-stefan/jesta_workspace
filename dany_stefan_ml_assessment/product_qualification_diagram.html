<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Qualification System Design</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f5f5f5;
            padding: 20px;
            margin: 0;
        }
        .container {
            max-width: 1600px;
            margin: 0 auto;
            background: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        h1 {
            color: #1a237e;
            text-align: center;
            margin-bottom: 10px;
        }
        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
            font-size: 16px;
        }
        .legend {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }
        .legend-item {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .legend-color {
            width: 20px;
            height: 20px;
            border-radius: 3px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Product Qualification Component Design</h1>
        <p class="subtitle">Intelligent filtering system: 12.6M → 3-4M products | Fix dead stock problem | Scale without OOM</p>
        
        <div class="legend">
            <div class="legend-item">
                <div class="legend-color" style="background-color: #64b5f6;"></div>
                <span>Data Inputs</span>
            </div>
            <div class="legend-item">
                <div class="legend-color" style="background-color: #ffb74d;"></div>
                <span>Business Logic</span>
            </div>
            <div class="legend-item">
                <div class="legend-color" style="background-color: #81c784;"></div>
                <span>Outputs</span>
            </div>
            <div class="legend-item">
                <div class="legend-color" style="background-color: #ba68c8;"></div>
                <span>Validation</span>
            </div>
        </div>

        <svg width="1550" height="1100" viewBox="0 0 1550 1100">
            <defs>
                <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
                    <polygon points="0 0, 10 3, 0 6" fill="#333" />
                </marker>
            </defs>
            
            <rect width="1550" height="1100" fill="#fafafa"/>
            
            <text x="775" y="30" font-size="22" font-weight="bold" text-anchor="middle" fill="#1a237e">Product Qualification Pipeline Architecture</text>
            
            <!-- INPUTS Section -->
            <rect x="50" y="60" width="450" height="320" fill="#e3f2fd" rx="8" stroke="#1976d2" stroke-width="2"/>
            <text x="275" y="90" font-size="18" font-weight="bold" text-anchor="middle" fill="#1565c0">1. INPUTS (9.15M rows)</text>
            
            <!-- Individual input boxes -->
            <rect x="70" y="110" width="190" height="45" fill="#64b5f6" rx="5"/>
            <text x="165" y="128" font-size="12" font-weight="bold" text-anchor="middle" fill="white">Sales History</text>
            <text x="165" y="143" font-size="10" text-anchor="middle" fill="white">3 years daily data</text>
            
            <rect x="280" y="110" width="190" height="45" fill="#64b5f6" rx="5"/>
            <text x="375" y="128" font-size="12" font-weight="bold" text-anchor="middle" fill="white">Inventory Data</text>
            <text x="375" y="143" font-size="10" text-anchor="middle" fill="white">Stock levels, replenish</text>
            
            <rect x="70" y="170" width="190" height="45" fill="#64b5f6" rx="5"/>
            <text x="165" y="188" font-size="12" font-weight="bold" text-anchor="middle" fill="white">Product Metadata</text>
            <text x="165" y="203" font-size="10" text-anchor="middle" fill="white">Category, lifecycle</text>
            
            <rect x="280" y="170" width="190" height="45" fill="#64b5f6" rx="5"/>
            <text x="375" y="188" font-size="12" font-weight="bold" text-anchor="middle" fill="white">Channel Flags</text>
            <text x="375" y="203" font-size="10" text-anchor="middle" fill="white">Store/Ecom availability</text>
            
            <rect x="70" y="230" width="190" height="45" fill="#64b5f6" rx="5"/>
            <text x="165" y="248" font-size="12" font-weight="bold" text-anchor="middle" fill="white">Restock History</text>
            <text x="165" y="263" font-size="10" text-anchor="middle" fill="white">Last restock date</text>
            
            <rect x="280" y="230" width="190" height="45" fill="#64b5f6" rx="5"/>
            <text x="375" y="248" font-size="12" font-weight="bold" text-anchor="middle" fill="white">Price/Markdown</text>
            <text x="375" y="263" font-size="10" text-anchor="middle" fill="white">Clearance events</text>
            
            <text x="275" y="295" font-size="11" text-anchor="middle" fill="#666">Format: Polars DataFrame (chunked)</text>
            <text x="275" y="315" font-size="11" text-anchor="middle" fill="#666">150k SKUs × 61 stores</text>
            <text x="275" y="335" font-size="11" font-weight="bold" text-anchor="middle" fill="#d32f2f">Memory: ~2GB</text>
            <text x="275" y="355" font-size="11" text-anchor="middle" fill="#666">Processing: Chunked (500k rows/batch)</text>

            <path d="M 500 220 L 540 220" stroke="#333" stroke-width="3" fill="none" marker-end="url(#arrowhead)"/>
            
            <!-- BUSINESS RULES Section -->
            <rect x="540" y="60" width="470" height="780" fill="#fff3e0" rx="8" stroke="#f57c00" stroke-width="2"/>
            <text x="775" y="90" font-size="18" font-weight="bold" text-anchor="middle" fill="#e65100">2. BUSINESS RULES ENGINE</text>
            
            <!-- Physical Stores Box -->
            <rect x="560" y="110" width="430" height="180" fill="#ffcc80" rx="5" stroke="#f57c00" stroke-width="1"/>
            <text x="775" y="130" font-size="14" font-weight="bold" text-anchor="middle">Physical Stores Logic</text>
            <text x="570" y="155" font-size="11" font-weight="bold">Active Criteria:</text>
            <text x="580" y="172" font-size="10">• Sales in last 90d > 0 OR Restocked in last 60d</text>
            <text x="580" y="187" font-size="10">• Inventory > 0 AND replenishable = TRUE</text>
            <text x="570" y="210" font-size="11" font-weight="bold">Category Adjustments:</text>
            <text x="580" y="227" font-size="10">• Footwear: 60d window (high velocity)</text>
            <text x="580" y="242" font-size="10">• Sportswear: 90d + seasonal flag</text>
            <text x="580" y="257" font-size="10">• Made-to-measure: 180d (low velocity)</text>
            <text x="580" y="272" font-size="10">• Accessories: 120d window</text>
            
            <!-- Ecom Box -->
            <rect x="560" y="305" width="430" height="150" fill="#ffcc80" rx="5" stroke="#f57c00" stroke-width="1"/>
            <text x="775" y="325" font-size="14" font-weight="bold" text-anchor="middle">E-commerce Logic</text>
            <text x="570" y="350" font-size="11" font-weight="bold">Active Criteria:</text>
            <text x="580" y="367" font-size="10">• Currently listed online = TRUE</text>
            <text x="580" y="382" font-size="10">• Sales in last 120d > 0 OR New product (< 30d)</text>
            <text x="580" y="397" font-size="10">• New products: launch < 30d AND inventory > 5</text>
            <text x="580" y="412" font-size="10">• Not marked as discontinued</text>
            <text x="580" y="437" font-size="10" font-weight="bold" fill="#d32f2f">Note: Only 15k of 150k products are actually online</text>
            
            <!-- High vs Low Volume Box -->
            <rect x="560" y="470" width="430" height="140" fill="#ffcc80" rx="5" stroke="#f57c00" stroke-width="1"/>
            <text x="775" y="490" font-size="14" font-weight="bold" text-anchor="middle">High vs Low Volume Categories</text>
            <text x="570" y="515" font-size="11" font-weight="bold">High Volume (Footwear, Sportswear):</text>
            <text x="580" y="532" font-size="10">• Shorter lookback (60-90d), focus recent velocity</text>
            <text x="580" y="547" font-size="10">• Stockout-aware qualification</text>
            <text x="570" y="572" font-size="11" font-weight="bold">Low Volume (Made-to-Measure, Luxury):</text>
            <text x="580" y="589" font-size="10">• Longer lookback (180+d), consider custom orders</text>
            <text x="580" y="604" font-size="10">• More lenient thresholds</text>
            
            <!-- New vs Mature Box -->
            <rect x="560" y="625" width="430" height="140" fill="#ffcc80" rx="5" stroke="#f57c00" stroke-width="1"/>
            <text x="775" y="645" font-size="14" font-weight="bold" text-anchor="middle">New vs Mature Products</text>
            <text x="570" y="670" font-size="11" font-weight="bold">New (< 90d since launch):</text>
            <text x="580" y="687" font-size="10">• Grace period: 30d before qualification</text>
            <text x="580" y="702" font-size="10">• Lower threshold: 1+ sale, inventory > 5</text>
            <text x="570" y="727" font-size="11" font-weight="bold">Mature (> 90d):</text>
            <text x="580" y="744" font-size="10">• Standard thresholds apply</text>
            <text x="580" y="759" font-size="10">• Stricter inventory & replenishment rules</text>
            
            <!-- Dead Stock Box -->
            <rect x="560" y="780" width="430" height="50" fill="#ffcdd2" rx="5" stroke="#d32f2f" stroke-width="2"/>
            <text x="775" y="800" font-size="13" font-weight="bold" text-anchor="middle" fill="#b71c1c">Dead Stock Criteria (Auto-Exclude)</text>
            <text x="580" y="820" font-size="10" fill="#d32f2f">Zero sales 180+d | No restock 120+d | Discontinued | Clearance > 90d with no sales</text>

            <path d="M 1010 420 L 1050 420" stroke="#333" stroke-width="3" fill="none" marker-end="url(#arrowhead)"/>
            
            <!-- OUTPUTS Section -->
            <rect x="1050" y="60" width="450" height="320" fill="#e8f5e9" rx="8" stroke="#388e3c" stroke-width="2"/>
            <text x="1275" y="90" font-size="18" font-weight="bold" text-anchor="middle" fill="#2e7d32">3. OUTPUTS (3-4M rows)</text>
            
            <!-- Individual output boxes -->
            <rect x="1070" y="110" width="190" height="50" fill="#81c784" rx="5"/>
            <text x="1165" y="128" font-size="12" font-weight="bold" text-anchor="middle" fill="white">Qualified Product List</text>
            <text x="1165" y="143" font-size="10" text-anchor="middle" fill="white">SKU, store, status, reason</text>
            
            <rect x="1280" y="110" width="190" height="50" fill="#81c784" rx="5"/>
            <text x="1375" y="128" font-size="12" font-weight="bold" text-anchor="middle" fill="white">Qualification Metrics</text>
            <text x="1375" y="143" font-size="10" text-anchor="middle" fill="white">Counts by status/category</text>
            
            <rect x="1070" y="175" width="190" height="50" fill="#81c784" rx="5"/>
            <text x="1165" y="193" font-size="12" font-weight="bold" text-anchor="middle" fill="white">Forecast-Ready Dataset</text>
            <text x="1165" y="208" font-size="10" text-anchor="middle" fill="white">Filtered 3-4M products</text>
            
            <rect x="1280" y="175" width="190" height="50" fill="#81c784" rx="5"/>
            <text x="1375" y="193" font-size="12" font-weight="bold" text-anchor="middle" fill="white">Pipeline Integration</text>
            <text x="1375" y="208" font-size="10" text-anchor="middle" fill="white">Pre-processing step</text>
            
            <!-- Impact metrics box -->
            <rect x="1070" y="240" width="400" height="80" fill="#c8e6c9" rx="5" stroke="#388e3c" stroke-width="1"/>
            <text x="1270" y="260" font-size="12" font-weight="bold" text-anchor="middle" fill="#1b5e20">Impact Metrics</text>
            <text x="1080" y="280" font-size="10" fill="#2e7d32">✓ Dataset: 12.6M → 3-4M products (70% reduction)</text>
            <text x="1080" y="295" font-size="10" fill="#2e7d32">✓ Memory: ~2GB → ~600MB (65% reduction)</text>
            <text x="1080" y="310" font-size="10" fill="#2e7d32">✓ Training speed: 30-40% faster</text>
            
            <text x="1275" y="345" font-size="11" text-anchor="middle" fill="#666">Format: Parquet (compressed, columnar)</text>
            <text x="1275" y="365" font-size="11" font-weight="bold" text-anchor="middle" fill="#2e7d32">Feeds directly into forecast model</text>

            <!-- SCALE Section -->
            <rect x="50" y="420" width="450" height="250" fill="#e1bee7" rx="8" stroke="#8e24aa" stroke-width="2"/>
            <text x="275" y="450" font-size="18" font-weight="bold" text-anchor="middle" fill="#6a1b9a">4. SCALE (No OOM)</text>
            
            <text x="70" y="480" font-size="13" font-weight="bold" fill="#6a1b9a">Memory Optimization:</text>
            <text x="80" y="500" font-size="10">• Chunked processing: 500k rows/batch (Polars lazy)</text>
            <text x="80" y="515" font-size="10">• Data types: categorical (SKU/store), int16, float32</text>
            <text x="80" y="530" font-size="10">• Streaming: Never load full 9.15M into memory</text>
            
            <text x="70" y="555" font-size="13" font-weight="bold" fill="#6a1b9a">Parallel Processing:</text>
            <text x="80" y="575" font-size="10">• Multi-threading: Polars native parallelism (CPU)</text>
            <text x="80" y="590" font-size="10">• Store-level parallel: Process 61 stores independently</text>
            <text x="80" y="605" font-size="10">• Category batching: Split by Footwear/Sportswear/etc.</text>
            
            <text x="70" y="630" font-size="13" font-weight="bold" fill="#6a1b9a">Scalability:</text>
            <text x="80" y="650" font-size="10">• Current: 150k × 61 = 9.15M rows (~2GB)</text>
            <text x="80" y="665" font-size="10">• Future: 500k × 200 = 100M rows (~20GB, still OK)</text>
            
            <!-- VALIDATION Section -->
            <rect x="1050" y="420" width="450" height="420" fill="#f3e5f5" rx="8" stroke="#8e24aa" stroke-width="2"/>
            <text x="1275" y="450" font-size="18" font-weight="bold" text-anchor="middle" fill="#6a1b9a">5. VALIDATION</text>
            
            <text x="1070" y="480" font-size="13" font-weight="bold" fill="#6a1b9a">Operational Metrics:</text>
            <text x="1080" y="500" font-size="10">• Product count: 12.6M → 3-4M (track weekly)</text>
            <text x="1080" y="515" font-size="10">• Memory usage: Peak < 4GB (monitor real-time)</text>
            <text x="1080" y="530" font-size="10">• Processing time: < 15 min (target)</text>
            <text x="1080" y="545" font-size="10">• Error rate: 0 logic errors (unit tests)</text>
            
            <text x="1070" y="570" font-size="13" font-weight="bold" fill="#6a1b9a">Business Metrics:</text>
            <text x="1080" y="590" font-size="10">• Qualification rate by category: 20-30% overall</text>
            <text x="1080" y="605" font-size="10">• False negatives: Products marked dead but sold (audit)</text>
            <text x="1080" y="620" font-size="10">• False positives: Forecasted but never sold (audit)</text>
            <text x="1080" y="635" font-size="10">• Forecast coverage: > 95% of actual sales</text>
            
            <text x="1070" y="660" font-size="13" font-weight="bold" fill="#6a1b9a">Model Impact:</text>
            <text x="1080" y="680" font-size="10">• WMAPE improvement: 15-25% reduction expected</text>
            <text x="1080" y="695" font-size="10">• OOM crashes: Target 0 crashes</text>
            <text x="1080" y="710" font-size="10">• Training speed: 30-40% faster</text>
            <text x="1080" y="725" font-size="10">• Accuracy by category: Before/after comparison</text>
            
            <text x="1070" y="750" font-size="13" font-weight="bold" fill="#6a1b9a">Validation Workflow:</text>
            <text x="1080" y="770" font-size="10">✓ Weekly: Sample 100 random products, verify sales</text>
            <text x="1080" y="785" font-size="10">✓ Monthly: Dashboard with qualification trends</text>
            <text x="1080" y="800" font-size="10">✓ Quarterly: SME review, adjust thresholds</text>
            <text x="1080" y="815" font-size="10">✓ A/B Testing: Parallel forecasts with/without</text>
            
            <!-- Success Box -->
            <rect x="50" y="700" width="450" height="160" fill="#c8e6c9" rx="8" stroke="#388e3c" stroke-width="2"/>
            <text x="275" y="730" font-size="16" font-weight="bold" text-anchor="middle" fill="#1b5e20">Success Criteria</text>
            
            <text x="70" y="760" font-size="11" fill="#2e7d32">✓ WMAPE reduced by at least 15% from qualification alone</text>
            <text x="70" y="780" font-size="11" fill="#2e7d32">✓ Zero OOM crashes for 4 consecutive weeks</text>
            <text x="70" y="800" font-size="11" fill="#2e7d32">✓ Processing time stable at < 15 minutes</text>
            <text x="70" y="820" font-size="11" fill="#2e7d32">✓ False negative rate < 5%</text>
            <text x="70" y="840" font-size="11" fill="#2e7d32">✓ Stakeholder sign-off on qualification logic</text>
            
            <!-- Processing Flow -->
            <rect x="540" y="880" width="470" height="160" fill="#fff9c4" rx="8" stroke="#fbc02d" stroke-width="2"/>
            <text x="775" y="910" font-size="16" font-weight="bold" text-anchor="middle" fill="#f57f17">Processing Flow (Polars Pipeline)</text>
            
            <text x="560" y="935" font-size="11" fill="#333">1. Load data in chunks (500k rows) → Lazy evaluation</text>
            <text x="560" y="955" font-size="11" fill="#333">2. Apply business rules per chunk → Parallel execution</text>
            <text x="560" y="975" font-size="11" fill="#333">3. Write qualified products to Parquet → Incremental</text>
            <text x="560" y="995" font-size="11" fill="#333">4. Generate metrics & alerts → Real-time monitoring</text>
            <text x="560" y="1015" font-size="11" fill="#333">5. Feed to forecast model → Pre-processing complete</text>
            
            <text x="775" y="1040" font-size="10" font-style="italic" text-anchor="middle" fill="#666">Total processing time: ~15 minutes | Memory peak: ~4GB | Zero OOM crashes</text>
            
        </svg>
    </div>
</body>
</html>
